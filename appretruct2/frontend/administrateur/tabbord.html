
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tableau de bord | Appretruct</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        crossorigin="anonymous"
    >

    <!-- Police Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Fond neutre -->
    <style>
        html, body {
            min-height: 100%;
            background: #ffffff;
        }

        body {
            margin: 0;
        }
    </style>

</head>

<body>
    <div id="admin-header-root"></div>

    <!-- =========================================
         CONTENU PRINCIPAL
    ========================================== -->






        <!-- ZONE PRINCIPALE -->
        <main class="admin-main" id="dashboard">

    


            <!-- =========================================
                 COMPTES INSCRITS
            ========================================== -->

            <section
                class="admin-section"
                id="comptes-inscrits"
            >

             

                <!-- Le composant ComptesInscrits.jsx sera affiché ici -->
                <div id="comptes-inscrits-root"></div>

            </section>

        </main>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <div id="footer-root"></div>


    <!-- =========================================
         CHARGEMENT DES COMPOSANTS REACT
    ========================================== -->

    <script type="module">

        import React from "react";
        import { createRoot } from "react-dom/client";

        import HeaderAdmin from "../src/administrateur/header.jsx";
        import ComptesInscrits
            from "../src/administrateur/compteinscrit.jsx";

        createRoot(
            document.getElementById("admin-header-root")
        ).render(React.createElement(HeaderAdmin));

        import Footer
            from "../src/footer.jsx";


        // Afficher les comptes inscrits
        createRoot(
            document.getElementById("comptes-inscrits-root")
        ).render(
            React.createElement(ComptesInscrits)
        );


        // Afficher le footer
        createRoot(
            document.getElementById("footer-root")
        ).render(
            React.createElement(Footer)
        );

    </script>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous">
    </script>

</body>
</html>

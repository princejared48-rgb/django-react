<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Gérez votre profil candidat sur Appretruct."
    >

    <title>Mon profil | Appretruct</title>

    <!-- Police Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <!-- Zone d'affichage du profil utilisateur avec React -->
    <div id="profil-utilisateur-root"></div>

    <!-- Chargement du composant React -->
    <script type="module">
        import React from "react";
        import { createRoot } from "react-dom/client";
        import ProfilUtilisateur from "/src/utilisateur/profil.jsx";

        // Afficher le profil utilisateur
        createRoot(
            document.getElementById("profil-utilisateur-root")
        ).render(
            React.createElement(ProfilUtilisateur)
        );
    </script>

</body>

</html>

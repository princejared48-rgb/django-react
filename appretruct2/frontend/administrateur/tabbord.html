
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tableau de bord | Appretruct</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        crossorigin="anonymous"
    >

    <!-- Police Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- CSS du tableau de bord -->
    <link rel="stylesheet" href="./tabbord.css">

</head>

<body>

    <!-- =========================================
         HEADER
    ========================================== -->



    <!-- =========================================
         CONTENU PRINCIPAL
    ========================================== -->

    <div class="admin-layout">

        <!-- MENU LATÉRAL -->
        <aside class="admin-sidebar">

            <div class="sidebar-title">
                MENU PRINCIPAL
            </div>

            <a
                href="#dashboard"
                class="sidebar-link active"
            >
                <i class="fas fa-chart-line"></i>
                <span>Tableau de bord</span>
            </a>

            <a
                href="#comptes-inscrits"
                class="sidebar-link"
            >
                <i class="fas fa-users"></i>
                <span>Comptes inscrits</span>
            </a>

            <div class="sidebar-separator"></div>

            <a
                href="/acceuiltotal/acceuiltotal.html"
                class="sidebar-link"
            >
                <i class="fas fa-arrow-left"></i>
                <span>Retour à l'accueil</span>
            </a>

        </aside>


        <!-- ZONE PRINCIPALE -->
        <main class="admin-main" id="dashboard">

    


            <!-- =========================================
                 COMPTES INSCRITS
            ========================================== -->

            <section
                class="admin-section"
                id="comptes-inscrits"
            >

             

                <!-- Le composant ComptesInscrits.jsx sera affiché ici -->
                <div id="comptes-inscrits-root"></div>

            </section>

        </main>

    </div>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer id="footer-root"></footer>


    <!-- =========================================
         CHARGEMENT DES COMPOSANTS REACT
    ========================================== -->

    <script type="module">

        import React from "react";
        import { createRoot } from "react-dom/client";

        // Composants déjà créés
        import ComptesInscrits
            from "../src/administrateur/compteinscrit.jsx";

        import Footer
            from "../src/footer.jsx";


        // Afficher les comptes inscrits
        createRoot(
            document.getElementById("comptes-inscrits-root")
        ).render(
            React.createElement(ComptesInscrits)
        );


        // Afficher le footer
        createRoot(
            document.getElementById("footer-root")
        ).render(
            React.createElement(Footer)
        );

    </script>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous">
    </script>

</body>
</html>

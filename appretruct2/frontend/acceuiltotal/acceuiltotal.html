<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accueil | Appretruct</title>

    <!-- Bootstrap 5.0.2 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">

    <!-- Police Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Fond simple chargé avant React -->
    <style>
        html {
            min-height: 100%;
            background-color: #ffffff;
        }

        body {
            margin: 0;
            min-height: 100%;
            font-family: 'Poppins', sans-serif;
            color: #17233c;
            background: #ffffff;
        }

        main {
            position: relative;
            background: transparent;
        }

        /* Bandeau d'appel à l'action */
        .section-inscription {
            position: relative;
            max-width: 1200px;
            margin: 18px auto 70px;
            padding: 56px clamp(22px, 5vw, 70px);
            overflow: hidden;
            text-align: center;
            color: #17233c;
            border: 1px solid #e3eaf5;
            border-radius: 24px;
            background:
                radial-gradient(ellipse at 18% 0%, rgba(47, 127, 232, 0.1), transparent 55%),
                radial-gradient(ellipse at 90% 110%, rgba(255, 107, 53, 0.08), transparent 55%),
                #ffffff;
            box-shadow: 0 14px 34px rgba(16, 34, 64, 0.1);
        }

        .section-inscription .cta-kicker {
            color: #d4551f;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .section-inscription h2 {
            margin: 12px 0 14px;
            color: #0d1b33;
            font-size: clamp(24px, 3.6vw, 34px);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .section-inscription p {
            max-width: 640px;
            margin: 0 auto 28px;
            color: #4a5c78;
            font-size: 14px;
            line-height: 1.8;
        }

        .bouton-inscription {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 26px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff7a45, #ff5a1f);
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 14px 30px rgba(255, 107, 53, 0.35);
            transition: transform 0.25s ease, filter 0.25s ease;
        }

        .bouton-inscription:hover {
            color: #ffffff;
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        @media (max-width: 576px) {
            .section-inscription {
                margin: 10px 14px 50px;
                padding: 40px 20px;
                border-radius: 18px;
            }

            .section-inscription h2 {
                font-size: 22px;
            }

            .section-inscription p {
                font-size: 12.5px;
            }
        }
    </style>

</head>

<body>

    <!-- Header React -->
    <div id="header"></div>

    <main>

        <!-- Section Carrousel -->
        <section id="accueil-carrousel" class="container-fluid carrosel">
            <div id="carrosel"></div>
        </section>

        <!-- Section des formations -->
        <section id="formations">
            <div id="formations-root"></div>
        </section>

        <!-- Appel à l'action : inscription -->
        <section class="section-inscription" id="inscription">
            <span class="cta-kicker">REJOIGNEZ APPRETRUCT</span>
            <h2>Prêt à démarrer votre carrière ?</h2>
            <p>
                Créez votre compte candidat ou entreprise en quelques minutes
                et accédez à toutes les opportunités de la plateforme.
            </p>
            <a class="bouton-inscription" href="/inscription/inscription.html">
                Créer mon compte
                <i class="fa-solid fa-arrow-right"></i>
            </a>
        </section>

    </main>

    <!-- Footer React -->
    <div id="footer"></div>

    <!-- Chargement des composants React -->
    <script type="module">

        import React from "react";
        import { createRoot } from "react-dom/client";

        import Header from "../src/total/header.jsx";
        import Footer from "../src/footer.jsx";
        import Carrosel from "../src/carrosel.jsx";
        import Formations from "../src/formation.jsx";

        // Header
        createRoot(
            document.getElementById("header")
        ).render(
            React.createElement(Header)
        );

        // Carrousel
        createRoot(
            document.getElementById("carrosel")
        ).render(
            React.createElement(Carrosel)
        );

        // Cartes des formations
        createRoot(
            document.getElementById("formations-root")
        ).render(
            React.createElement(Formations)
        );

        // Footer
        createRoot(
            document.getElementById("footer")
        ).render(
            React.createElement(Footer)
        );

    </script>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous">
    </script>

</body>

</html>

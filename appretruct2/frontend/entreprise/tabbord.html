<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Tableau de bord | Appretruct</title>

<style>
    html, body {
        min-height: 100%;
        background: #ffffff;
    }

    body {
        margin: 0;
    }
</style>

<!-- Police Poppins -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<!-- Font Awesome -->
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>


</head>

<body>
    <div id="page-header"></div>
    <!-- Zone d'affichage du composant React -->
    <div id="tabbord-root"></div>
    <!-- Footer React -->
    <div id="footer-root"></div>


<!-- Chargement du composant React -->
<script type="module">
    import React from "react";
        import Header from "../src/entreprise/header.jsx";
    import { createRoot } from "react-dom/client";
        createRoot(document.getElementById("page-header")).render(React.createElement(Header));
    import Tabbord from "/src/entreprise/profil.jsx";
    import Footer from "../src/footer.jsx";

    // Tableau de bord entreprise
    createRoot(document.getElementById("tabbord-root")).render(
        React.createElement(Tabbord)
    );

    // Footer
    createRoot(document.getElementById("footer-root")).render(
        React.createElement(Footer)
    );
</script>

</body>
</html>
